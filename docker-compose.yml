services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: forecast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db

volumes:
  pgdata: